<script>
// Edit this list only. Newest first.
// Entry shape: { title, authors, venue, abstract, links: { PDF: "url", Code: "url" } }
const papers = [
  {
    title: "Truthful Verified Credit: Rewarding Verified Value, Not Reliance, Among Learning Agents",
    authors: "Nhan Nguyen",
    venue: "Preprint, 2026",
    abstract: "We study the problem of how to credit each self-interested agent for its own contribution to a shared return that incentivises them to truthfully report to maximise social welfare. We propose truthful verified credit (TVC), which rewards only verified value, adds a bonus for every checked claim, and fines audited false claims, and can be used as a supplement of an existing credit mechanism. In a multi-agent bandit, TVC cuts exaggeration from over 90% of reports to below 1% at welfare comparable to popularity credit, and combined with credit for exploration it keeps reports honest at the highest welfare. In multi-robot pathfinding on POGEMA, it cuts the hype rate of self-interested learners from 99% to 0.2% and triples lifelong throughput, and lying stays below 5% with DQN and PPO learners.",
    links: { PDF: "papers/tvc.pdf" }
  },
  {
    title: "Emergent Behavioural Signalling in Cooperative Multi-Agent Highway Driving",
    authors: "Nhan Nguyen",
    venue: "Master thesis, Lancaster University",
    abstract: "Autonomous highway driving is a multi-agent coordination problem in which every vehicle carries a private behavioural type that others cannot observe directly. This thesis formulates cooperative multi-agent highway driving as a repeated signalling game over a small discrete vocabulary of behaviourally grounded tokens whose meanings are not pre-assigned. It then asks whether communication emerges among the agents at all, and in what sense. The agents are trained using multi-agent reinforcement learning and the signalling channel is probed with evaluation-time interventions that separately disturb the token, the neighbour kinematics, and their binding. Communication does emerge, not in the form standard information metrics are designed to register, but through what we call convention-of-use. The token carries almost no information about a driver's hidden type. Nevertheless, corrupting the binding between token and behaviour raises the collision rate by 65 to 86%, depending on how the binding is broken. In this experiment, the active interventions revealed a dependence on the channel that the passive metrics did not register. This suggests that evaluations of emergent communication, and audits of connected-driving systems, should test the binding between message and behaviour directly rather than rely on measured informativeness alone.",
    links: { PDF: "papers/Emergent%20Behavioural%20Signalling%20in%20Cooperative%20Multi-Agent%20Highway%20Driving.pdf" }
  },
  {
    title: "Werewolf - How to be a Better Villager",
    authors: "Chew Jin Cheng, Duong Minh Hoang, Hoang Phuong Nam, Nhan Nguyen, Vuong Thanh Cong (alphabetical order)",
    venue: "Coursework",
    abstract: "This study investigates whether smaller language models (SLMs) can improve their performance when guided by larger language model (LLMs) in a multi-agent game. As the current research on how SLMs perform when supported by LLMs is limited, the study focuses on integrating a Coach-Player framework into the Werewolf game. In this study, villager agents are supported by a coach to play against the wolf agents to evaluate the impact of guidance on game performance. The results indicate that while the models with lower capability show no improvement, using coaching improves the performance for higher ones by increasing win rate from 55% to 74%. These findings suggest that as long as the model is able to interpret and apply the guidance, coaching can improve its performance.",
    links: { PDF: "papers/werewolf.pdf" }
  },
];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("papers").innerHTML = papers.map(p => `
  <div class="paper">
    <h3>${esc(p.title)}</h3>
    <p class="muted">${esc(p.authors)}</p>
    <p><em>${esc(p.venue)}</em></p>
    <p class="links">${Object.entries(p.links || {}).map(([k, v]) => `<a href="${esc(v)}">${esc(k)}</a>`).join("")}</p>
    ${p.abstract ? `<details><summary>Abstract</summary><p>${esc(p.abstract)}</p></details>` : ""}
  </div>`).join("");

// Open every link in a new tab (mailto excluded: it would leave a blank tab).
document.querySelectorAll('a:not([href^="mailto:"])').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
</script>
